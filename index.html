<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Gram-Schmidt</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182033;--muted:#697386;--u:#e55353;--v:#3b73e6;--w:#20a36a;--up:#b52d2d;--vp:#2451ad;--wp:#13714a;--accent:#6b4eff;--grid:#dce2ec;--axis:#7b8496;--ok:#158a55;--border:#e5e9f1;--canvas:#fff;--step:#485267;--equation:#f4f1ff;--secondary:#e9edf5;--secondaryInk:#293247}
:root[data-theme="dark"]{--bg:#111521;--card:#1b2130;--ink:#edf1fa;--muted:#aeb7c9;--u:#ff7070;--v:#6696ff;--w:#55d99b;--up:#ff9a9a;--vp:#8bb0ff;--wp:#86e8b8;--accent:#8b75ff;--grid:#30394b;--axis:#8d98ac;--ok:#48d497;--border:#30394b;--canvas:#151b28;--step:#cbd3e2;--equation:#292442;--secondary:#30394b;--secondaryInk:#edf1fa}
*{box-sizing:border-box}html,body{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);transition:background .2s,color .2s}.page{max-width:1120px;margin:auto;padding:20px 15px 32px}h1{margin:0;font-size:clamp(26px,4vw,40px);letter-spacing:-.03em}.subtitle{color:var(--muted);margin:8px 0 24px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:15px;align-items:start}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 8px 30px rgba(30,45,80,.07)}.graph-card{padding:10px}.stage{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--canvas)}canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}.graph-help{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--card) 78%,transparent);padding:5px 8px;border-radius:8px;pointer-events:none}.side{display:grid;gap:12px}.panel{padding:14px}.panel h2{font-size:17px;margin:0 0 14px}.vectors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.vecbox{border:1px solid var(--border);border-radius:12px;padding:9px;min-width:0}.vecname{font-weight:800;margin-bottom:7px}.matrix{display:inline-grid;grid-template-rows:repeat(3,1fr);gap:2px;position:relative;padding:2px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}.matrix:before,.matrix:after{content:"";position:absolute;top:0;bottom:0;width:6px;border-top:2px solid currentColor;border-bottom:2px solid currentColor}.matrix:before{left:0;border-left:2px solid currentColor}.matrix:after{right:0;border-right:2px solid currentColor}.muted{color:var(--muted);opacity:.72}.steps{min-height:245px}.step-title{font-weight:800;font-size:18px;margin-bottom:9px}.step-text{color:var(--step);line-height:1.5}.equation{margin-top:13px;padding:11px 12px;border-radius:10px;background:var(--equation);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55;overflow-wrap:anywhere}.hint{margin-top:10px;font-size:13px;color:var(--muted)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{appearance:none;border:0;border-radius:11px;padding:11px 15px;font-weight:800;font-size:14px;cursor:pointer;transition:.15s transform,.15s opacity}button:hover{transform:translateY(-1px)}button:active{transform:none}.primary{background:var(--accent);color:#fff}.secondary{background:var(--secondary);color:var(--secondaryInk)}.legend{display:flex;flex-wrap:wrap;gap:11px;padding:12px 4px 2px;font-size:12px;color:var(--muted)}.dot{width:10px;height:10px;display:inline-block;border-radius:50%;margin-right:5px;vertical-align:-1px}.status{font-weight:800;color:var(--ok)}.visibility-controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.visibility-toggle{padding:9px 10px;border:1px solid var(--border);background:var(--secondary);color:var(--secondaryInk)}.visibility-toggle[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}.wide{grid-column:1/-1}@media(max-width:930px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.steps-panel{grid-column:1/-1}}@media(max-width:650px){.side{grid-template-columns:1fr}.steps-panel{grid-column:auto}.vectors{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><div class="page"><h1>3D Gram–Schmidt</h1><p class="subtitle"></p><div class="layout"><div class="card graph-card"><div class="stage"><canvas id="graph" width="900" height="900" aria-label="Interactive 3D vector graph"></canvas><div class="graph-help">Drag vector tips • Drag empty space to rotate view</div></div><div class="legend"><span><i class="dot" style="background:var(--u)"></i>U</span><span><i class="dot" style="background:var(--v)"></i>V</span><span><i class="dot" style="background:var(--w)"></i>W</span><span><i class="dot" style="background:var(--up)"></i>U′</span><span><i class="dot" style="background:var(--vp)"></i>V′</span><span><i class="dot" style="background:var(--wp)"></i>W′</span></div></div><div class="side"><section class="card panel steps-panel"><h2>Steps</h2><div class="steps"><div id="stepTitle" class="step-title">Ready to begin</div><div id="stepText" class="step-text">Begin by clicking <b>Orthogonalization Process</b>.</div><div id="equation" class="equation" style="display:none"></div><div id="hint" class="hint">Before starting, U, V, and W can be freely repositioned.</div></div><div class="controls"><button id="startBtn" class="primary">Orthogonalization Process</button><button id="resetBtn" class="secondary">Reset Process</button></div></section><section class="card panel"><h2>Vector values</h2><div class="vectors"><div class="vecbox"><div class="vecname" style="color:var(--u)">U</div><div id="uMat"></div></div><div class="vecbox"><div class="vecname" style="color:var(--v)">V</div><div id="vMat"></div></div><div class="vecbox"><div class="vecname" style="color:var(--w)">W</div><div id="wMat"></div></div><div class="vecbox"><div class="vecname" style="color:var(--up)">U′</div><div id="upMat" class="muted">—</div></div><div class="vecbox"><div class="vecname" style="color:var(--vp)">V′</div><div id="vpMat" class="muted">—</div></div><div class="vecbox"><div class="vecname" style="color:var(--wp)">W′</div><div id="wpMat" class="muted">—</div></div></div></section><section class="card panel"><h2>Appearance</h2><button id="themeToggle" class="secondary" type="button" aria-pressed="true">☀️ Light mode</button><div class="visibility-controls"><button id="toggleU" class="visibility-toggle" aria-pressed="true">U: On</button><button id="toggleV" class="visibility-toggle" aria-pressed="true">V: On</button><button id="toggleW" class="visibility-toggle" aria-pressed="true">W: On</button><button id="toggleUp" class="visibility-toggle" aria-pressed="true">U′: On</button><button id="toggleVp" class="visibility-toggle" aria-pressed="true">V′: On</button><button id="toggleWp" class="visibility-toggle" aria-pressed="true">W′: On</button><button id="toggleGuides" class="visibility-toggle wide" aria-pressed="true">Dotted Lines / Plane: On</button></div></section></div></div></div>
<script>
(()=>{
const c=document.getElementById('graph'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);const els={uMat:$('uMat'),vMat:$('vMat'),wMat:$('wMat'),upMat:$('upMat'),vpMat:$('vpMat'),wpMat:$('wpMat'),title:$('stepTitle'),text:$('stepText'),eq:$('equation'),hint:$('hint')};
const RANGE=3,SNAP=.17,HITPX=27;let U,V,W,Up=null,Vp=null,Wp=null,phase='setup',drag=null,dragPlane=null,lastPointer=null;let vTarget=null,wTarget=null,normDone={U:false,V:false,W:false};let yaw=-.72,pitch=.48;const visible={U:true,V:true,W:true,Up:true,Vp:true,Wp:true,guides:true};
const add=(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z}),sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}),scale=(a,s)=>({x:a.x*s,y:a.y*s,z:a.z*s}),dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,mag=a=>Math.hypot(a.x,a.y,a.z),unit=a=>scale(a,1/mag(a)),dist=(a,b)=>mag(sub(a,b)),cross=(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x});
function randomVec(){let a;do{a={x:Math.random()*4.4-2.2,y:Math.random()*4.4-2.2,z:Math.random()*4.4-2.2}}while(mag(a)<1.2||mag(a)>2.8);return a}
function goodSet(){let u=randomVec(),v,w;do{v=randomVec()}while(Math.abs(dot(unit(u),unit(v)))>.86);let vp=sub(v,scale(u,dot(u,v)/dot(u,u)));do{w=randomVec()}while(mag(sub(sub(w,scale(u,dot(u,w)/dot(u,u))),scale(vp,dot(vp,w)/dot(vp,vp))))<.65);return[u,v,w]}
function setStep(t,s,h='',eq=''){els.title.innerHTML=t;els.text.innerHTML=s;els.hint.innerHTML=h;els.eq.style.display=eq?'block':'none';els.eq.innerHTML=eq}
function mat(a){return `<span class="matrix"><span>${a.x.toFixed(2)}</span><span>${a.y.toFixed(2)}</span><span>${a.z.toFixed(2)}</span></span>`}
function updateMats(){for(const[k,a]of[['uMat',U],['vMat',V],['wMat',W],['upMat',Up],['vpMat',Vp],['wpMat',Wp]]){els[k].innerHTML=a?mat(a):'—';els[k].className=a?'':'muted'}}
function reset(){[U,V,W]=goodSet();Up=Vp=Wp=null;vTarget=wTarget=null;phase='setup';drag=dragPlane=null;normDone={U:false,V:false,W:false};$('startBtn').disabled=false;$('startBtn').style.opacity=1;setStep('Ready to begin','Begin by clicking <b>Orthogonalization Process</b>.','Before starting, U, V, and W can be freely repositioned.');update()}
function basis(){let cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);return{right:{x:cy,y:-sy,z:0},up:{x:sy*sp,y:cy*sp,z:cp},forward:{x:sy*cp,y:cy*cp,z:-sp}}}
function project(p){let b=basis(),s=c.width/(2*RANGE*1.45),cx=c.width/2,cy=c.height/2;return{x:cx+dot(p,b.right)*s,y:cy-dot(p,b.up)*s,depth:dot(p,b.forward),scale:s}}
function screenDist(p,x,y){let q=project(p);return Math.hypot(q.x-x,q.y-y)}
function css(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()}
function line3(a,b,color,width=1,dash=[]){let A=project(a),B=project(b);ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.restore()}
function arrow(a,color,label,alpha=1){let o=project({x:0,y:0,z:0}),p=project(a),ang=Math.atan2(p.y-o.y,p.x-o.x);ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-17*Math.cos(ang-.5),p.y-17*Math.sin(ang-.5));ctx.lineTo(p.x-17*Math.cos(ang+.5),p.y-17*Math.sin(ang+.5));ctx.closePath();ctx.fill();ctx.font='700 18px system-ui';ctx.fillText(label,p.x+9,p.y-9);ctx.restore()}
function sphere(a,color,r=14){let p=project(a);ctx.save();ctx.globalAlpha=.26;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(p.x-4,p.y-4,r*.35,0,Math.PI*2);ctx.stroke();ctx.restore()}
function plane(){if(!Vp)return;let eu=unit(U),tmp=sub(Vp,scale(eu,dot(Vp,eu))),ev=unit(tmp),r=3.25,pts=[add(scale(eu,r),scale(ev,r)),add(scale(eu,-r),scale(ev,r)),add(scale(eu,-r),scale(ev,-r)),add(scale(eu,r),scale(ev,-r))].map(project);ctx.save();ctx.fillStyle=css('--accent');ctx.globalAlpha=.10;ctx.strokeStyle=css('--muted');ctx.lineWidth=1.5;ctx.setLineDash([8,7]);ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<4;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function drawGrid(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle=css('--canvas');ctx.fillRect(0,0,c.width,c.height);let grid=css('--grid'),axis=css('--axis');for(let i=-RANGE;i<=RANGE;i++){line3({x:-RANGE,y:i,z:0},{x:RANGE,y:i,z:0},i===0?axis:grid,i===0?2:1);line3({x:i,y:-RANGE,z:0},{x:i,y:RANGE,z:0},i===0?axis:grid,i===0?2:1)}line3({x:0,y:0,z:-RANGE},{x:0,y:0,z:RANGE},axis,2);ctx.fillStyle=axis;ctx.font='13px system-ui';for(let i=-RANGE;i<=RANGE;i++)if(i){for(const p of[{x:i,y:0,z:0},{x:0,y:i,z:0},{x:0,y:0,z:i}]){let q=project(p);ctx.fillText(String(i),q.x+5,q.y-5)}}let labels=[['X',{x:3.2,y:0,z:0}],['Y',{x:0,y:3.2,z:0}],['Z',{x:0,y:0,z:3.2}]];ctx.font='700 15px system-ui';for(const[l,p]of labels){let q=project(p);ctx.fillText(l,q.x,q.y)}}
function draw(){drawGrid();if(visible.guides&&phase!=='setup'){if((phase==='wProject'||phase==='normalize'||phase==='complete')&&Vp)plane();if(phase==='vProject'&&vTarget){line3(V,vTarget,css('--muted'),2,[9,8]);sphere(vTarget,css('--vp'))}if((phase==='wProject'||phase==='normalize')&&wTarget){let n=unit(cross(U,Vp));line3(scale(n,-3.7),scale(n,3.7),css('--muted'),2,[9,8]);line3(W,wTarget,css('--muted'),2,[9,8]);if(phase==='wProject')sphere(wTarget,css('--wp'))}if(phase==='normalize'){sphere(unit(U),css('--up'));sphere(unit(Vp),css('--vp'));sphere(unit(Wp),css('--wp'))}}
let fade=phase==='setup'?1:.34;if(visible.U)arrow(U,css('--u'),'U',phase==='normalize'&&!normDone.U?1:fade);if(visible.V)arrow(V,css('--v'),'V',fade);if(visible.W)arrow(W,css('--w'),'W',fade);if(Up&&visible.Up)arrow(Up,css('--up'),'U′');if(Vp&&visible.Vp)arrow(Vp,css('--vp'),'V′');if(Wp&&visible.Wp)arrow(Wp,css('--wp'),'W′')}
function update(){updateMats();draw()}
function start(){phase='vProject';$('startBtn').disabled=true;$('startBtn').style.opacity=.55;vTarget=sub(V,scale(U,dot(U,V)/dot(U,U)));Vp={...V};setStep('Orthogonalize V','Drag <b>V</b> toward the transparent sphere to remove its component along U.','The dotted guide leads to V′. It will snap into place.',`V′ = V − Proj<sub>U</sub>(V)<br>Proj<sub>U</sub>(V) = [(U · V) / (U · U)] * U`);update()}
function finishV(){Vp={...vTarget};let pU=scale(U,dot(U,W)/dot(U,U)),pV=scale(Vp,dot(Vp,W)/dot(Vp,Vp));wTarget=sub(sub(W,pU),pV);Wp={...W};phase='wProject';setStep('Orthogonalize W','Make <b>W</b> orthogonal to both <b>U</b> and <b>V′</b>. Drag W toward the transparent sphere.','The translucent plane is span(U, V′). The dotted normal is perpendicular to both.',`W′ = W − Proj<sub>U</sub>(W) − Proj<sub>V′</sub>(W)<br>Proj<sub>U</sub>(W) = [(U · W)/(U · U)] * U<br>Proj<sub>V′</sub>(W) = [(V′ · W)/(V′ · V′)] * V′`);update()}
function finishW(){Wp={...wTarget};phase='normalize';Up=null;normDone={U:false,V:false,W:false};setStep('Orthogonalized — normalize','U, V′, and W′ are mutually orthogonal. Now normalize all three vectors.','Drag U to pull out U′, then drag U′, V′, and W′ to their transparent unit-sphere markers.',`ê₁ = U / ‖U‖<br>ê₂ = V′ / ‖V′‖<br>ê₃ = W′ / ‖W′‖`);update()}
function checkNorm(kind,p){let src=kind==='U'?U:kind==='V'?vTarget:wTarget,target=unit(src);if(dist(p,target)<SNAP){if(kind==='U')Up=target;else if(kind==='V')Vp=target;else Wp=target;normDone[kind]=true;if(normDone.U&&normDone.V&&normDone.W){phase='complete';setStep('<span class="status">Complete!</span>','The Gram–Schmidt process is complete.','U′, V′, and W′ now form an orthonormal basis.')}update();return true}return false}
function rayPlanePoint(e,planeNormal,planePoint){let r=c.getBoundingClientRect(),sx=(e.clientX-r.left)*c.width/r.width,sy=(e.clientY-r.top)*c.height/r.height,b=basis(),S=c.width/(2*RANGE*1.45),a=(sx-c.width/2)/S,bb=-(sy-c.height/2)/S,origin=add(scale(b.right,a),scale(b.up,bb)),den=dot(b.forward,planeNormal);if(Math.abs(den)<.06)return planePoint;let t=dot(sub(planePoint,origin),planeNormal)/den;return add(origin,scale(b.forward,t))}
function down(e){let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width,y=(e.clientY-r.top)*c.height/r.height;lastPointer={x:e.clientX,y:e.clientY};if(phase==='setup'){let hits=[['U',U],['V',V],['W',W]].map(([k,p])=>[k,screenDist(p,x,y)]).sort((a,b)=>a[1]-b[1]);if(hits[0][1]<HITPX){drag=hits[0][0];dragPlane=basis().forward}else drag='camera'}else if(phase==='vProject'&&screenDist(Vp,x,y)<HITPX)drag='vProject';else if(phase==='wProject'&&screenDist(Wp,x,y)<HITPX)drag='wProject';else if(phase==='normalize'){let hits=[];if(!normDone.U)hits.push(['normU',Up||U]);if(!normDone.V)hits.push(['normV',Vp]);if(!normDone.W)hits.push(['normW',Wp]);hits.sort((a,b)=>screenDist(a[1],x,y)-screenDist(b[1],x,y));if(hits.length&&screenDist(hits[0][1],x,y)<HITPX){drag=hits[0][0];if(drag==='normU'&&!Up)Up={...U}}else drag='camera'}else drag='camera';c.setPointerCapture(e.pointerId)}
function move(e){if(!drag)return;if(drag==='camera'){let dx=e.clientX-lastPointer.x,dy=e.clientY-lastPointer.y;yaw+=dx*.008;pitch=Math.max(-1.15,Math.min(1.15,pitch+dy*.008));lastPointer={x:e.clientX,y:e.clientY};draw();return}if(drag==='U'||drag==='V'||drag==='W'){let cur=drag==='U'?U:drag==='V'?V:W,p=rayPlanePoint(e,dragPlane,cur);p={x:Math.max(-RANGE,Math.min(RANGE,p.x)),y:Math.max(-RANGE,Math.min(RANGE,p.y)),z:Math.max(-RANGE,Math.min(RANGE,p.z))};if(mag(p)>.2){if(drag==='U')U=p;else if(drag==='V')V=p;else W=p}update();return}if(drag==='vProject'){let path=sub(vTarget,V),t=dot(sub(rayPlanePoint(e,basis().forward,Vp),V),path)/dot(path,path);t=Math.max(0,Math.min(1,t));Vp=add(V,scale(path,t));if(dist(Vp,vTarget)<SNAP){drag=null;finishV()}else update();return}if(drag==='wProject'){let path=sub(wTarget,W),t=dot(sub(rayPlanePoint(e,basis().forward,Wp),W),path)/dot(path,path);t=Math.max(0,Math.min(1,t));Wp=add(W,scale(path,t));if(dist(Wp,wTarget)<SNAP){drag=null;finishW()}else update();return}let kind=drag==='normU'?'U':drag==='normV'?'V':'W',src=kind==='U'?U:kind==='V'?vTarget:wTarget,d=unit(src),p=rayPlanePoint(e,basis().forward,kind==='U'?Up:kind==='V'?Vp:Wp),t=Math.max(.12,dot(p,d)),q=scale(d,t);if(kind==='U')Up=q;else if(kind==='V')Vp=q;else Wp=q;checkNorm(kind,q);update()}
function up(){drag=null;dragPlane=null}c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);$('startBtn').onclick=start;$('resetBtn').onclick=reset;window.addEventListener('resize',draw);
[['toggleU','U','U'],['toggleV','V','V'],['toggleW','W','W'],['toggleUp','Up','U′'],['toggleVp','Vp','V′'],['toggleWp','Wp','W′'],['toggleGuides','guides','Dotted Lines / Plane']].forEach(([id,key,label])=>{$(id).onclick=()=>{visible[key]=!visible[key];$(id).setAttribute('aria-pressed',String(visible[key]));$(id).textContent=`${label}: ${visible[key]?'On':'Off'}`;draw()}});reset();
})();
</script>
<script>(()=>{const root=document.documentElement,btn=document.getElementById('themeToggle'),saved=localStorage.getItem('gram-schmidt-3d-theme');if(saved==='light')delete root.dataset.theme;else root.dataset.theme='dark';function sync(){let dark=root.dataset.theme==='dark';btn.textContent=dark?'☀️ Light mode':'🌙 Dark mode';btn.setAttribute('aria-pressed',String(dark))}btn.onclick=()=>{let dark=root.dataset.theme==='dark';if(dark)delete root.dataset.theme;else root.dataset.theme='dark';localStorage.setItem('gram-schmidt-3d-theme',dark?'light':'dark');sync();window.dispatchEvent(new Event('resize'))};sync()})();</script>
</body></html>
